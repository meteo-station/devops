{{- $fullName := include "app.fullname" . -}}
{{- $root := . -}}
{{- range $name, $job := .Values.cronjobs }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s" $fullName $name }}
  labels:
    {{- include "app.labels" $root | nindent 4 }}
    app.kubernetes.io/component: cronjob
spec:
  schedule: {{ $job.schedule | quote }}
  {{- with $job.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ $job.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit | default 1 }}
  {{- with $job.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  suspend: {{ $job.suspend | default false }}
  jobTemplate:
    spec:
      backoffLimit: {{ $job.backoffLimit | default 3 }}
      {{- with $job.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with $job.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "app.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: cronjob
            cronjob: {{ $name }}
        spec:
          serviceAccountName: {{ include "app.serviceAccountName" $root }}
          restartPolicy: {{ $job.restartPolicy | default "OnFailure" }}
          {{- with $root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ $name }}
              image: {{ $job.image | default (include "app.image" $root) }}
              imagePullPolicy: {{ $job.imagePullPolicy | default $root.Values.image.pullPolicy }}
              {{- with $root.Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if or $root.Values.envs $root.Values.secretEnv }}
              envFrom:
                {{- if $root.Values.envs }}
                - configMapRef:
                    name: {{ $fullName }}
                {{- end }}
                {{- if $root.Values.secretEnv }}
                - secretRef:
                    name: {{ $fullName }}
                {{- end }}
              {{- end }}
              {{- with $job.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.volumeMounts }}
              volumeMounts:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with $job.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (default $root.Values.nodeSelector $job.nodeSelector) }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (default $root.Values.tolerations $job.tolerations) }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (default $root.Values.affinity $job.affinity) }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
