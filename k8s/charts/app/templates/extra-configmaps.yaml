{{- $root := . -}}
{{- range $name, $cm := .Values.extraConfigMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "app.fullname" $root) $name }}
  labels:
    {{- include "app.labels" $root | nindent 4 }}
data:
  {{- range $key, $value := $cm.data }}
  {{ $key }}: |
    {{- if $cm.raw }}
    {{- /* raw: содержимое отдаётся как есть. Нужно там, где {{ }} принадлежат
           не Helm, а целевому приложению — например Jinja в Home Assistant. */}}
    {{- $value | toString | nindent 4 }}
    {{- else }}
    {{- tpl ($value | toString) $root | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
