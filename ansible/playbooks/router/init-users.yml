---
- name: Initial server setup
  hosts: router
  become: yes
  vars:
    ansible_user: root
    ansible_port: 22
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_bonavi

  roles:
    - role: users
    - role: ssh_hardening
    - role: hostname
    - role: fail2ban
    - role: unattended_upgrades
    - role: reboot
