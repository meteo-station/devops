---
hostname: pi
github_registry: "ghcr.io"

# Два независимых WG-интерфейса под разные цели (wireguard.md, глава 8.4 —
# отдельный проект, отдельная подсеть, даже если это один и тот же хост):
#
# wg-public-proxy  — pi как КЛИЕНТ к coin-1. Узкоцелевой туннель: единственная
#                    задача — дать coin-1 (у которого есть публичный IP) проксировать
#                    домен HA наружу, т.к. у pi своего публичного IP нет (дом за NAT).
#                    Endpoint/persistent_keepalive обязательны — pi инициирует сам.
#
# wg0              — pi как СЕРВЕР (хаб) для личного админ-доступа с Мака.
#                    Не пересекается с wg-public-proxy ни по подсети, ни по ключам: утечка
#                    одного туннеля не даёт доступа ко второму.
wireguard:
  - interface: wg-public-proxy
    address: ["10.10.10.2/24"]
    peers:
      - name: coin-1
        public_key: "f++QSJhEl25Betr3WWQNi0e4Ams6pXaZpC/KwwCx/nw="
        allowed_ips: ["10.10.10.1/32"]
        endpoint: "coin-1.bonavii.com:51820"
        persistent_keepalive: 25

  - interface: wg0
    address: ["10.20.20.1/24"]
    listen_port: 51821
    peers:
      - name: macbook-bonavi
        public_key: "Bk0TlaI6U5sTZ9nwuBz8ZAyHL1iTdeXvnNrNWkVqaD8="
        allowed_ips: ["10.20.20.2/32"]

firewall_allowed_ports:
  # Клиентские открытые публично
  - { port: 80, protocol: tcp }                            # http
  - { port: 443, protocol: tcp }                           # https

  - { port: 8927, protocol: tcp }                         # Music Assistant Discovery
  - { port: 8095, protocol: tcp }                         # Music Assistant Discovery
  - { port: 8097, protocol: tcp }                         # Music Assistant Discovery
  - { port: 39831, protocol: tcp }                        # Music Assistant Discovery
  - { port: 319, protocol: udp }                          # AirPlay PTP
  - { port: 320, protocol: udp }                          # AirPlay PTP

  - { port: 18555, protocol: tcp }                        # go2rtc

  # Системные открытые публично
  - { port: 5353, protocol: udp }                          # mDNS - для определения устройств
  - { port: 1900, protocol: udp }                          # SSDP - для определения устройств
  - { port: 51821, protocol: udp }                         # wg0 handshake — вход с Мака (pi тут сервер)

  # Системные открытые выборочно
  - { port: 1883, protocol: tcp, source: 192.168.1.43/32 } # mosquitto - только для
  - { port: 2002, protocol: tcp, interface: wg0 }          # SSH — только через личный админ-туннель
  - { port: 6443, protocol: tcp, interface: wg0 }          # kube-apiserver — только через личный админ-туннель
