- name: Create users
  user:
    name: "{{ item.name }}"
    create_home: yes
    password: "{{ item.password | password_hash('sha512') }}"
    shell: /bin/bash
    state: present
    groups: "{{ item.groups | default([]) }}"
  loop: "{{ users }}"

- name: Add SSH public key for each user
  ansible.builtin.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key_pub }}"
    state: present
  loop: "{{ users }}"
  when: item.ssh_key_pub is defined and item.ssh_key_pub | length > 0

- name: Configure sudoers for user
  copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.sudoers_rules | join('\n') }}\n"
    mode: '0440'
    validate: visudo -cf %s
  loop: "{{ users }}"
  when: item.sudoers_rules is defined and item.sudoers_rules | length > 0

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure sshd_config includes sshd_config.d
  # Must be the first line: sshd keeps the FIRST value for each directive,
  # so an Include placed lower would lose to directives set above it.
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    insertbefore: BOF
    firstmatch: yes
    owner: root
    group: root
    mode: '0644'
    validate: sshd -t -f %s

- name: Configure SSH hardening drop-in
  # Name starts with 00- so it is read before 50-cloud-init.conf.
  # sshd uses the FIRST value it sees for each directive, so this wins.
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      Port {{ ssh_port }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: '0644'

- name: Set hostname
  hostname:
    name: "{{ hostname }}"

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: Configure fail2ban jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = {{ fail2ban_bantime }}
      findtime = {{ fail2ban_findtime }}
      maxretry = {{ fail2ban_maxretry }}
      backend  = systemd
      ignoreip = {{ fail2ban_ignoreip | join(' ') }}

      [sshd]
      enabled = true
      port    = {{ ssh_port }}
    owner: root
    group: root
    mode: '0644'
  register: fail2ban_config

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: yes
    state: "{{ 'restarted' if fail2ban_config.changed else 'started' }}"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: yes

- name: Enable periodic apt updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: '0644'

- name: Configure unattended-upgrades (security only, optional auto-reboot)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if unattended_auto_reboot else 'false' }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ unattended_reboot_time }}";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
    owner: root
    group: root
    mode: '0644'

- name: Ensure unattended-upgrades service is enabled
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: yes
    state: started

- name: Reboot machine
  reboot:
    msg: "Rebooting machine in 5 seconds"
