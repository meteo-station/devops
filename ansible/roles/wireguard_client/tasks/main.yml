---
# roles/wireguard_client/tasks/main.yml

- name: Fail fast if server params are missing
  ansible.builtin.assert:
    that:
      - wireguard_server_public_key | length > 0
      - wireguard_server_endpoint | length > 0
    fail_msg: "wireguard_server_public_key и wireguard_server_endpoint обязательны для клиента"

- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true

- name: Ensure config dir exists with restricted permissions
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# --- Ключи -----------------------------------------------------------------

# Приватный ключ приходит из ansible-vault (host_vars/<host>/secrets.yml).
# Генерации на хосте больше нет: ключ, созданный на месте, существовал в одном
# экземпляре и терялся вместе с диском, а публичный приходилось вычитывать из
# вывода роли и вручную переносить в env.yml другого хоста.
- name: Fail fast if private key is not provided from vault
  ansible.builtin.assert:
    that:
      - wireguard_private_key is defined
      - wireguard_private_key | length == 44
    fail_msg: >-
      wireguard_private_key обязателен и должен лежать в host_vars/{{ inventory_hostname }}/secrets.yml
      (ansible-vault). Сгенерировать новую пару: wg genkey | tee /dev/stderr | wg pubkey

# Ключ подставляется в wg0.conf напрямую (шаблон ниже), отдельный файл
# privatekey не нужен — убираем оставшийся от прежней схемы, чтобы копия
# ключа не лежала на диске в двух местах.
- name: Remove leftover on-host private key file
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}/privatekey"
    state: absent

# --- Конфиг ------------------------------------------------------------------

- name: Deploy wg0.conf
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_dir }}/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  # no_log: в конфиг подставляется приватный ключ, и при --diff / -v Ansible
  # вывел бы его целиком в терминал и в логи CI.
  no_log: true
  notify: restart wireguard

# --- Автозапуск ------------------------------------------------------------------

- name: Enable and start WireGuard interface
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: "{{ wireguard_enabled }}"
    state: started

