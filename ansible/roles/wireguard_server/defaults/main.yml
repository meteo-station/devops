---
# roles/wireguard_server/defaults/main.yml

wireguard_interface: wg0
wireguard_config_dir: /etc/wireguard

# Адрес сервера в WG-сети
wireguard_address: "10.10.10.1/24"
wireguard_listen_port: 51820

# Обязателен, задаётся в host_vars/<host>/secrets.yml под ansible-vault.
# Дефолта нет намеренно: пустое значение отсекает assert в роли, а не молча
# порождает конфиг с невалидным ключом.

# Список клиентов (пиров), которым разрешено подключаться.
# Публичный ключ пира вычисляется из его приватного (wg pubkey) и прописывается
# сюда через host_vars — он не секрет и лежит в открытом envs.yml.
#
# wireguard_peers:
#   - name: raspberry-pi
#     public_key: "ABCDEF...="
#     allowed_ips: ["10.10.10.2/32"]
wireguard_peers: []

wireguard_manage_firewall: true
wireguard_enabled: true
