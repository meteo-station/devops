---
- name: Copy node_exporter files to the server
  template:
    src: "{{ item.src }}"
    dest: "{{ project_dir }}/{{ item.dest }}"
  loop:
    - { src: docker-compose.node_exporter.yml.j2, dest: docker-compose.node_exporter.yml }

- name: Run node_exporter down
  command: docker service rm ssp_node_exporter
  args:
    chdir: "{{ project_dir }}"

- name: Run node_exporter
  command: docker stack deploy --with-registry-auth -c {{ project_dir }}/docker-compose.yml -c {{ project_dir }}/docker-compose.node_exporter.yml {{ cluster }}
  args:
    chdir: "{{ project_dir }}"
