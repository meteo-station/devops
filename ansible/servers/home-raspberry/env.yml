project_dir: "/home/bonavi"
compose_project_name: "raspberry"
domains:
  - name: grafana.home
    port: 3000
    basic_auth: false
    type: site
    ssl_certificate_path: /etc/nginx/ssl/wildcard.home.crt
    ssl_key_path: /etc/nginx/ssl/wildcard.home.key

  - name: prometheus.home
    port: 9090
    basic_auth: true
    type: site
    ssl_certificate_path: /etc/nginx/ssl/wildcard.home.crt
    ssl_key_path: /etc/nginx/ssl/wildcard.home.key
