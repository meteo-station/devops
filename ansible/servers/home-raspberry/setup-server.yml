---
- hosts: raspberry
  become: yes

  vars_files:
    - ../../secrets.yml
    - ../../env.yml
    - env.yml
    - secrets.yml
  tasks:

    - name: Setup project environment
      import_role:
        name: project-environment

    - name: Setup docker
      import_role:
        name: docker

    - name: Setup docker environment
      import_role:
        name: docker-environment
