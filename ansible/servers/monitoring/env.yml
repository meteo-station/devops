project_dir: "/opt/monitoring"
compose_project_name: "monitoring"
db_name: superset
domains:
  - name: grafana.bonavii.com
    port: 3000
    basic_auth: false
    type: site
    ssl_certificate_path: /etc/nginx/ssl/fullchain.pem
    ssl_key_path: /etc/nginx/ssl/privkey.pem

  - name: prometheus.bonavii.com
    port: 9090
    basic_auth: true
    type: site
    ssl_certificate_path: /etc/nginx/ssl/fullchain.pem
    ssl_key_path: /etc/nginx/ssl/privkey.pem
